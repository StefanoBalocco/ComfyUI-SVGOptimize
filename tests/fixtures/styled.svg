<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="120" height="80" viewBox="0 0 120 80">
  <style>
    .sky { fill: rgb(135, 206, 235); }
    .sun { fill: #FFD700; stroke: #FF8C00; stroke-width: 2px; }
    g .tree { fill: #228b22; }
  </style>
  <defs>
    <path id="tri" d="M 0 20 L 10 0 L 20 20 Z" class="tree"/>
    <linearGradient id="unused"><stop offset="0" stop-color="#FFFFFF"/></linearGradient>
  </defs>
  <rect class="sky" x="0" y="0" width="120" height="80"/>
  <circle class="sun" cx="95" cy="20" r="10"/>
  <g>
    <use xlink:href="#tri" x="10" y="50"/>
    <use xlink:href="#tri" x="40" y="50"/>
  </g>
</svg>
